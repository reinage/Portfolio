<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nebula Fine Art</title>

  <link rel="stylesheet" href="../style.css">

  <script src="../js/jquery.min.1.7.js"></script>
  <script src="../js/turn.js"></script>
  <script src="../script.js" defer></script>
</head>

<body>


    <div class="content nosidebarpls">
  <!-- FLIPBOOK STAGE (IMPORTANT WRAPPER) -->
  <div class="flipbook-stage">

    <!-- UI OVERLAY -->
    <div class="book-ui">

      <button class="nav-btn prev"
        onclick="$('#flipbook').turn('previous')">
        ‹
      </button>

      <button class="nav-btn next"
        onclick="$('#flipbook').turn('next')">
        ›
      </button>
      
      <button class="close-btn"
        onclick="location.href='http://nebulafine.art/MEd'">
        ✕
      </button>

    </div> <!-- UI -->
    <!-- FLIPBOOK -->
    <div id="flipbook">
 
      
      <div class="page" style="background-image:url('../Webfool/Fool (1).png')"></div>
      <div class="page" style="background-image:url('../Webfool/Fool (2).png')"></div>
      <div class="page" style="background-image:url('../Webfool/Fool (3).png')"></div>

      <div class="page" style="background-image:url('../Webfool/Fool (15).png')"></div>
