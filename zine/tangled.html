<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nebula Fine Art</title>

  <link rel="stylesheet" href="../style.css">

  <script src="../js/jquery.min.1.7.js"></script>
  <script src="../js/turn.js"></script>
  <script src="../script.js" defer></script>
</head>

<body>


    <div class="content nosidebarpls">
  <!-- FLIPBOOK STAGE (IMPORTANT WRAPPER) -->
  <div class="flipbook-stage">

    <!-- UI OVERLAY -->
    <div class="book-ui">

      <button class="nav-btn prev"
        onclick="$('#flipbook').turn('previous')">
        ‹
      </button>

      <button class="nav-btn next"
        onclick="$('#flipbook').turn('next')">
        ›
      </button>

      <button class="close-btn"
        onclick="location.href='http://nebulafine.art/MEd'">
        ✕
      </button>

    </div> <!-- UI -->
    <!-- FLIPBOOK -->
    <div id="flipbook">
 
      
      <div class="page" style="background-image:url('../tangled/Tangled (1).png')"></div>
      <div class="page" style="background-image:url('../tangled/Tangled (2).png')"></div>
      <div class="page" style="background-image:url('../tangled/Tangled (3).png')"></div>
      <div class="page" style="background-image:url('../tangled/Tangled (4).png')"></div>
      <div class="page" style="background-image:url('../tangled/Tangled (5).png')"></div>
      <div class="page" style="background-image:url('../tangled/Tangled (6).png')"></div>
      <div class="page" style="background-image:url('../tangled/Tangled (7).png')"></div>
      <div class="page" style="background-image:url('../tangled/Tangled (8).png')"></div>
      <div class="page" style="background-image:url('../tangled/Tangled (9).png')"></div>
      <div class="page" style="background-image:url('../tangled/Tangled (10).png')"></div>
      <div class="page" style="background-image:url('../tangled/Tangled (11).png')"></div>
      <div class="page" style="background-image:url('../tangled/Tangled (12).png')"></div>
      <div class="page" style="background-image:url('../tangled/Tangled (13).png')"></div>
      <div class="page" style="background-image:url('../tangled/Tangled (14).png')"></div>
      <div class="page" style="background-image:url('../tangled/Tangled (15).png')"></div>
      <div class="page" style="background-image:url('../tangled/Tangled (16).png')"></div>

    </div>  <!-- flipbook -->


</div> <!-- flipbook stage -->
</div> <!-- content-->

</body>
</html>
